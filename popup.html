<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOPM STIVE PRO</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #1a1d23;
      color: #e2e8f0;
      font-family: 'IBM Plex Sans', sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      padding: 8px;
      gap: 6px;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      flex-shrink: 0;
    }

    .header h1 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #60a5fa;
      text-transform: uppercase;
    }

    .header-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: #475569;
      letter-spacing: 0.05em;
    }

    /* ── CONTROLS ROW ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .radio-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #2d3748;
      background: #1e2330;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .radio-group label:has(input:checked) {
      border-color: #3b82f6;
      color: #93c5fd;
      background: #1e3a5f;
    }

    .radio-group input[type="radio"] {
      accent-color: #3b82f6;
      width: 11px;
      height: 11px;
    }

    .sigla-input {
      flex: 1;
      min-width: 100px;
      max-width: 160px;
      padding: 5px 8px;
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 4px;
      color: #e2e8f0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      transition: border-color 0.15s;
    }

    .sigla-input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .sigla-input::placeholder {
      color: #475569;
    }

    .btn-process {
      padding: 5px 14px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-process:hover { background: #1d4ed8; }
    .btn-process:active { transform: scale(0.97); }
    .btn-process.copied {
      background: #16a34a;
    }

    /* ── TEXTAREAS CONTAINER ── */
    .textareas {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }

    .textarea-wrap {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .textarea-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #475569;
      padding: 0 2px 3px 2px;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      width: 100%;
      min-height: 0;
      padding: 8px 10px;
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: none;
      transition: border-color 0.15s;
    }

    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    textarea::placeholder {
      color: #334155;
    }

    #outputText {
      border-color: #1e3a5f;
      color: #93c5fd;
    }

    #outputText:focus {
      border-color: #3b82f6;
    }

    /* ── FOOTER STATS ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 2px 4px;
    }

    .stats {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: #334155;
      white-space: pre;
    }

    .footer-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      color: #334155;
    }

    /* Scrollbar dark */
    textarea::-webkit-scrollbar { width: 4px; }
    textarea::-webkit-scrollbar-track { background: transparent; }
    textarea::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }
  </style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <h1>DOPM STIVE PRO</h1>
    <span class="header-badge">v3.0</span>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <div class="radio-group">
      <label><input type="radio" name="option" value="remove-all" checked> Remover quebras</label>
      <label><input type="radio" name="option" value="remove-empty"> Linhas vazias / tabs</label>
      <label><input type="radio" name="option" value="filter-rgs"> Filtrar RGs</label>
    </div>
    <input type="text" id="customSigla" class="sigla-input" placeholder="Sigla (ex: EPA)" />
    <button id="clearButton" class="btn-process" style="background: #dc2626;">LIMPAR</button>
    <button id="processButton" class="btn-process">▶ PROCESSAR</button>
  </div>

  <!-- TEXTAREAS -->
  <div class="textareas">
    <div class="textarea-wrap">
      <div class="textarea-label">entrada</div>
      <textarea id="inputText" placeholder="Cole o texto aqui..."></textarea>
    </div>
    <div class="textarea-wrap">
      <div class="textarea-label">saída</div>
      <textarea id="outputText" readonly placeholder="Texto processado aparecerá aqui..."></textarea>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="stats" id="stats"></div>
    <div class="footer-brand">⚡ Powered by Stive</div>
  </div>

</div>

<script src="popup.js"></script>
</body>
</html>
